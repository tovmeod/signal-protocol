[package]
name = "pysignal-protocol"
version = "0.2.3"
authors = ["jen <jen@freedom.press>"]
edition = "2018"
license = "AGPL-3.0-only"

[dependencies]
rand = "0.7.3"
libsignal-protocol-rust = { git = "https://github.com/freedomofpress/libsignal-client", rev="609a1de73380a2b9d314db625e6b2f0368e838ec" }
pyo3 = { version = "0.25.1", features = ["extension-module", "experimental-async", "macros"] }
pyo3-async-runtimes = { version = "0.25", features = ["attributes", "tokio-runtime"] }
pyo3-log = "0.12.0"
log = "0.4"
async-trait = "0.1.77"
once_cell = "1.19"
# Database dependencies
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "any", "sqlite", "migrate", "postgres"] }
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros", "time"] }  # Full runtime for async-to-sync bridging

[lib]
name = "signal_protocol"
crate-type = ["cdylib"]
